spring.application.name=Sms

# PostgreSQL connection used by the app. Manage the database in pgAdmin 4,
# but connect the backend directly to PostgreSQL.
spring.datasource.url=jdbc:postgresql://localhost:5432/Sms
spring.datasource.username=postgres
spring.datasource.password=abhinav123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

spring.sql.init.mode=never

server.port=8081

# JWT configuration
jwt.secret=change-this-secret-to-a-strong-random-value
jwt.expiration-ms=3600000

logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
